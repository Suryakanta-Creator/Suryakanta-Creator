<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="150" viewBox="0 0 1200 150">
<defs>
  <linearGradient id="rainbow" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#FF3CAC">
      <animate attributeName="stop-color" dur="8s" values="#FF3CAC;#00E5FF;#35F2B1;#FFD93D;#8B5CF6;#FF3CAC" repeatCount="indefinite"/>
    </stop>
    <stop offset="50%" stop-color="#784BA0">
      <animate attributeName="stop-color" dur="8s" values="#784BA0;#35F2B1;#FF9CEE;#00E5FF;#FFD93D;#784BA0" repeatCount="indefinite"/>
    </stop>
    <stop offset="100%" stop-color="#2B86C5">
      <animate attributeName="stop-color" dur="8s" values="#2B86C5;#8B5CF6;#FF3CAC;#35F2B1;#00E5FF;#2B86C5" repeatCount="indefinite"/>
    </stop>
  </linearGradient>
  <linearGradient id="rainbow2" x1="1" y1="0" x2="0" y2="0">
    <stop offset="0%" stop-color="#00E5FF">
      <animate attributeName="stop-color" dur="10s" values="#00E5FF;#FF3CAC;#FFD93D;#35F2B1;#8B5CF6;#00E5FF" repeatCount="indefinite"/>
    </stop>
    <stop offset="100%" stop-color="#8B5CF6">
      <animate attributeName="stop-color" dur="10s" values="#8B5CF6;#35F2B1;#2B86C5;#FF3CAC;#FFD93D;#8B5CF6" repeatCount="indefinite"/>
    </stop>
  </linearGradient>
  <filter id="glow" x="-20%" y="-40%" width="140%" height="180%">
    <feGaussianBlur stdDeviation="6" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>
<style>
  .front{animation:drift 7s ease-in-out infinite}
  .back{animation:drift2 9s ease-in-out infinite}
  .spark{animation:twinkle 2.2s ease-in-out infinite}
  @keyframes drift{0%,100%{transform:translateY(0)}50%{transform:translateY(6px)}}
  @keyframes drift2{0%,100%{transform:translateY(5px)}50%{transform:translateY(-4px)}}
  @keyframes twinkle{50%{opacity:.2}}
</style>
<rect width="1200" height="150" fill="#02070D"/>
<g class="back" opacity=".48">
  <path d="M0 58 C160 15 320 104 485 60 C665 12 830 100 1200 38 L1200 150 L0 150 Z" fill="url(#rainbow2)"/>
</g>
<g class="front" filter="url(#glow)">
  <path d="M0 78 C180 124 340 36 520 82 C700 128 875 40 1200 76 L1200 150 L0 150 Z" fill="url(#rainbow)"/>
</g>
<g fill="#FFFFFF" opacity=".8">
  <circle class="spark" cx="135" cy="38" r="1.8"/>
  <circle class="spark" cx="382" cy="26" r="1.4" style="animation-delay:-.6s"/>
  <circle class="spark" cx="615" cy="44" r="1.6" style="animation-delay:-1.1s"/>
  <circle class="spark" cx="892" cy="24" r="1.5" style="animation-delay:-1.5s"/>
  <circle class="spark" cx="1080" cy="48" r="1.8" style="animation-delay:-.9s"/>
</g>
</svg>