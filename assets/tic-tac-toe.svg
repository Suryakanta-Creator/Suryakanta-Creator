  <filter id="g"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<style>
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.grid{stroke:#16455e;stroke-width:3}.x{stroke:#00e5ff;stroke-width:10;stroke-linecap:round;filter:url(#g)}.o{stroke:#8b5cf6;stroke-width:10;fill:none;filter:url(#g)}
</style>
<rect width="1200" height="330" rx="24" fill="url(#bg)" stroke="#00e5ff" stroke-opacity=".28"/>
<text x="38" y="48" fill="#62efff" font-size="16">AUTO_GAME // TIC_TAC_TOE</text>
