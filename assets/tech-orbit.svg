<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320">
<defs>
<radialGradient id="r"><stop stop-color="#0b2030"/><stop offset="1" stop-color="#02070d"/></radialGradient>
<filter id="gl"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<style>
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.o1{animation:r1 18s linear infinite;transform-origin:600px 160px}.o2{animation:r2 24s linear infinite;transform-origin:600px 160px}.p{animation:p 2.4s ease-in-out infinite}.c{animation:c 6s ease-in-out infinite}
@keyframes r1{to{transform:rotate(360deg)}}@keyframes r2{to{transform:rotate(-360deg)}}@keyframes p{50%{opacity:.35}}@keyframes c{50%{transform:scale(1.03);transform-origin:600px 160px}}
</style>
<rect width="1200" height="320" rx="24" fill="url(#r)" stroke="#00e5ff" stroke-opacity=".28"/>
<circle cx="600" cy="160" r="118" fill="none" stroke="#00e5ff" stroke-opacity=".18" stroke-dasharray="5 8"/>
<circle cx="600" cy="160" r="85" fill="none" stroke="#8b5cf6" stroke-opacity=".24" stroke-dasharray="3 7"/>
<g class="c"><circle cx="600" cy="160" r="58" fill="#071724" stroke="#00e5ff" stroke-opacity=".65"/><text x="600" y="154" text-anchor="middle" fill="#e6fbff" font-size="17" font-weight="700">SURYAKANTA</text><text x="600" y="178" text-anchor="middle" fill="#00e5ff" font-size="14">CREATOR // CORE</text></g>
<g class="o1">
<g transform="translate(600 42)"><circle r="28" fill="#071724" stroke="#00e5ff"/><text y="5" text-anchor="middle" fill="#c9f9ff" font-size="12">JAVA</text></g>
<g transform="translate(718 160)"><circle r="30" fill="#071724" stroke="#00e5ff"/><text y="5" text-anchor="middle" fill="#c9f9ff" font-size="12">REACT</text></g>
<g transform="translate(600 278)"><circle r="30" fill="#071724" stroke="#00e5ff"/><text y="5" text-anchor="middle" fill="#c9f9ff" font-size="12">NEXT</text></g>
<g transform="translate(482 160)"><circle r="30" fill="#071724" stroke="#00e5ff"/><text y="5" text-anchor="middle" fill="#c9f9ff" font-size="12">PYTHON</text></g>
</g>
<g class="o2">
<g transform="translate(660 92)"><circle r="24" fill="#0d1020" stroke="#8b5cf6"/><text y="5" text-anchor="middle" fill="#e9ddff" font-size="10">SQL</text></g>
<g transform="translate(668 220)"><circle r="27" fill="#0d1020" stroke="#8b5cf6"/><text y="5" text-anchor="middle" fill="#e9ddff" font-size="10">SUPABASE</text></g>
<g transform="translate(532 220)"><circle r="25" fill="#0d1020" stroke="#8b5cf6"/><text y="5" text-anchor="middle" fill="#e9ddff" font-size="10">SPRING</text></g>
<g transform="translate(540 92)"><circle r="24" fill="#0d1020" stroke="#8b5cf6"/><text y="5" text-anchor="middle" fill="#e9ddff" font-size="10">GIT</text></g>
</g>
<text x="40" y="54" fill="#63f2ff" font-size="15" class="p">TECH_ORBIT // ACTIVE</text>
<text x="40" y="82" fill="#8198a8" font-size="13">systems rotating around one goal:</text>
<text x="40" y="108" fill="#d8e7f0" font-size="15">BUILD THINGS THAT MATTER.</text>
<text x="900" y="252" fill="#8198a8" font-size="13">FULL STACK</text><text x="900" y="276" fill="#63f2ff" font-size="16">× AI × SOFTWARE</text>
</svg>