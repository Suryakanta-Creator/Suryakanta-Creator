<svg xmlns="http://www.w3.org/2000/svg" width="540" height="260" viewBox="0 0 540 260">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#02070D"/>
    <stop offset=".58" stop-color="#07111A"/>
    <stop offset="1" stop-color="#0D1020"/>
  </linearGradient>
  <linearGradient id="edge" x1="0" x2="1">
    <stop stop-color="#8B5CF6"/>
    <stop offset="1" stop-color="#00E5FF"/>
  </linearGradient>
  <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="4" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>
<style>
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.card{animation:float 4.8s ease-in-out infinite;transform-origin:270px 130px;animation-delay:-1.2s}
.dot{animation:pulse 2.2s ease-in-out infinite}
.scan{animation:scan 5.4s linear infinite}
@keyframes float{0%,100%{transform:translateY(4px)}50%{transform:translateY(-7px)}}
@keyframes pulse{50%{opacity:.35;transform:scale(.86)}}
@keyframes scan{0%{transform:translateX(-150px)}100%{transform:translateX(610px)}}
</style>
<rect width="540" height="260" rx="26" fill="#02070D"/>
<g class="card">
  <rect x="15" y="15" width="510" height="230" rx="24" fill="url(#bg)" stroke="url(#edge)" stroke-width="1.5"/>
  <rect x="15" y="15" width="110" height="2" fill="#8B5CF6" opacity=".75" class="scan"/>
  <circle cx="42" cy="42" r="5" fill="#8B5CF6" class="dot"/>
  <text x="58" y="47" fill="#8B5CF6" font-size="11" font-weight="700">PROJECT // 02</text>
  <text x="36" y="82" fill="#EAFBFF" font-size="21" font-weight="800">PACKCHECK AI</text>
  <text x="36" y="106" fill="#00E5FF" font-size="12" font-weight="700">AI-ASSISTED COMPLIANCE SYSTEM</text>
  <text x="36" y="140" fill="#A9BDC9" font-size="11.5">OCR label extraction, compliance evaluation</text>
  <text x="36" y="159" fill="#A9BDC9" font-size="11.5">and evidence-driven human review.</text>
  <rect x="36" y="185" width="468" height="1" fill="#8B5CF6" opacity=".16"/>
  <text x="36" y="212" fill="#8B5CF6" font-size="11" font-weight="700">React • Spring Boot • Python</text>
  <text x="36" y="231" fill="#B69CFF" font-size="10.5">FastAPI • MySQL • OpenCV</text>
</g>
</svg>