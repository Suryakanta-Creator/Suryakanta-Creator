<text x="38" y="122" fill="#d8e7f0" font-size="15">STATUS:</text>
<text x="113" y="122" fill="#00e5ff" font-size="15">
  thinking...
  <animate attributeName="opacity" values="1;1;.35;1" dur="1.1s" repeatCount="indefinite"/>
</text>
<text x="38" y="165" fill="#8198a8" font-size="13">X = CYAN</text>
<text x="38" y="190" fill="#8198a8" font-size="13">O = VIOLET</text>
