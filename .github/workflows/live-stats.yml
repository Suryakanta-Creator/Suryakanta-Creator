name: Refresh Live Profile Stats

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/live-stats.yml"
      - ".github/scripts/generate_profile_stats.py"
  schedule:
    - cron: "41 0 * * *"

permissions:
  contents: write

concurrency:
  group: profile-generated-assets
  cancel-in-progress: false

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Generate custom live stats
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PROFILE_USER: Suryakanta-Creator
        run: python .github/scripts/generate_profile_stats.py

      - name: Commit generated stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/live-stats.svg
          git diff --cached --quiet && exit 0
          git commit -m "chore: refresh live profile stats"
          git pull --rebase origin main
          git push
