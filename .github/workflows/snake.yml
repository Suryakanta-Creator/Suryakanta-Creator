name: Generate Contribution Snake

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/snake.yml"
  schedule:
    - cron: "23 0 * * *"

permissions:
  contents: write

concurrency:
  group: profile-generated-assets
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/github-snake.svg?color_snake=#00E5FF&color_dots=#07111A,#0A3444,#006D7C,#00AFC3,#00E5FF
            assets/github-snake-dark.svg?palette=github-dark&color_snake=#8B5CF6&color_dots=#07111A,#0B2233,#005B70,#00A7BF,#00E5FF

      - name: Commit snake animation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-snake.svg assets/github-snake-dark.svg
          git diff --cached --quiet && exit 0
          git commit -m "chore: refresh contribution snake"
          git pull --rebase origin main
          git push
