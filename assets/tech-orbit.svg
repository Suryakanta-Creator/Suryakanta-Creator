<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360">
<defs>
  <radialGradient id="bg"><stop stop-color="#0b2030"/><stop offset="1" stop-color="#02070d"/></radialGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<style>
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.outer{animation:spin 20s linear infinite;transform-origin:600px 180px}
.inner{animation:spinBack 14s linear infinite;transform-origin:600px 180px}
.float{animation:float 2.8s ease-in-out infinite}
.float2{animation:float2 3.4s ease-in-out infinite}
.pulse{animation:pulse 2.2s ease-in-out infinite}
.scan{animation:scan 4s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}} @keyframes spinBack{to{transform:rotate(-360deg)}}
@keyframes float{50%{transform:translateY(-7px)}} @keyframes float2{50%{transform:translateY(6px)}}
@keyframes pulse{50%{opacity:.45}} @keyframes scan{0%{transform:translateX(-220px)}100%{transform:translateX(1220px)}}
</style>
<rect width="1200" height="360" rx="26" fill="url(#bg)" stroke="#00e5ff" stroke-opacity=".30"/>
<rect x="0" y="0" width="180" height="2" fill="#00e5ff" opacity=".55" class="scan"/>
<circle cx="600" cy="180" r="142" fill="none" stroke="#00e5ff" stroke-opacity=".17" stroke-dasharray="5 9"/>
<circle cx="600" cy="180" r="96" fill="none" stroke="#8b5cf6" stroke-opacity=".25" stroke-dasharray="4 7"/>
<g class="float">
  <circle cx="600" cy="180" r="62" fill="#071724" stroke="#00e5ff" stroke-opacity=".8" filter="url(#glow)"/>
  <text x="600" y="174" text-anchor="middle" fill="#e6fbff" font-size="17" font-weight="700">SURYAKANTA</text>
  <text x="600" y="198" text-anchor="middle" fill="#00e5ff" font-size="13">FULL STACK × AI</text>
</g>
<g class="outer">
  <g transform="translate(600 38)"><circle r="29" fill="#071724" stroke="#00e5ff"/><text y="5" text-anchor="middle" fill="#c9f9ff" font-size="11">JAVA</text></g>
  <g transform="translate(723 109)"><circle r="31" fill="#071724" stroke="#00e5ff"/><text y="5" text-anchor="middle" fill="#c9f9ff" font-size="11">REACT</text></g>
  <g transform="translate(723 251)"><circle r="31" fill="#071724" stroke="#00e5ff"/><text y="5" text-anchor="middle" fill="#c9f9ff" font-size="11">NEXT.JS</text></g>
  <g transform="translate(600 322)"><circle r="31" fill="#071724" stroke="#00e5ff"/><text y="5" text-anchor="middle" fill="#c9f9ff" font-size="11">PYTHON</text></g>
  <g transform="translate(477 251)"><circle r="31" fill="#071724" stroke="#00e5ff"/><text y="5" text-anchor="middle" fill="#c9f9ff" font-size="11">SPRING</text></g>
  <g transform="translate(477 109)"><circle r="31" fill="#071724" stroke="#00e5ff"/><text y="5" text-anchor="middle" fill="#c9f9ff" font-size="11">FASTAPI</text></g>
</g>
<g class="inner">
  <g transform="translate(600 84)"><circle r="24" fill="#0d1020" stroke="#8b5cf6"/><text y="4" text-anchor="middle" fill="#e9ddff" font-size="9">TYPESCRIPT</text></g>
  <g transform="translate(683 132)"><circle r="24" fill="#0d1020" stroke="#8b5cf6"/><text y="4" text-anchor="middle" fill="#e9ddff" font-size="10">VITE</text></g>
  <g transform="translate(683 228)"><circle r="25" fill="#0d1020" stroke="#8b5cf6"/><text y="4" text-anchor="middle" fill="#e9ddff" font-size="9">SUPABASE</text></g>
  <g transform="translate(600 276)"><circle r="25" fill="#0d1020" stroke="#8b5cf6"/><text y="4" text-anchor="middle" fill="#e9ddff" font-size="9">POSTGRES</text></g>
  <g transform="translate(517 228)"><circle r="24" fill="#0d1020" stroke="#8b5cf6"/><text y="4" text-anchor="middle" fill="#e9ddff" font-size="10">MYSQL</text></g>
  <g transform="translate(517 132)"><circle r="24" fill="#0d1020" stroke="#8b5cf6"/><text y="4" text-anchor="middle" fill="#e9ddff" font-size="10">GIT</text></g>
</g>
<text x="38" y="55" fill="#63f2ff" font-size="15" class="pulse">TECH_ORBIT // LIVE</text>
<text x="38" y="84" fill="#8198a8" font-size="13">moving stack • real tools • real builds</text>
<text x="38" y="112" fill="#d8e7f0" font-size="15">BUILD → TEST → LEARN → SHIP</text>
<g class="float2"><text x="918" y="286" fill="#8198a8" font-size="12">SYSTEM</text><text x="918" y="311" fill="#63f2ff" font-size="15">FULL STACK × AI</text><text x="918" y="333" fill="#b69cff" font-size="12">STATUS // ACTIVE</text></g>
</svg>