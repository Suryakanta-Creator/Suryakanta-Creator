name: Generate 3D Contribution Graph

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/profile-3d.yml"
      - ".github/3d-settings.json"
  schedule:
    - cron: "17 0 * * *"

permissions:
  contents: write

concurrency:
  group: profile-generated-assets
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Generate animated night-rainbow contribution world
        uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ github.token }}
          USERNAME: ${{ github.repository_owner }}

      - name: Commit generated graph
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-3d-contrib
          git diff --cached --quiet && exit 0
          git commit -m "chore: refresh animated rainbow 3D contribution graph"
          git pull --rebase origin main
          git push
